<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Auto Time Table Generator – Screen Walkthrough</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --bg:#E9EDF4; --paper:#FFFFFF; --soft:#F4F6FA; --ink:#1B2540; --muted:#5B6782; --line:#D3DAE6; --grid:#E3E8F0;
  --brand:#2F5FBF; --s1:#3D7DD8; --s2:#D98E22; --s3:#2F9C82; --s4:#C9576E; --s5:#7A6BD1; --s6:#3F94B5;
  --good:#2F9C82; --bad:#C9576E; --warn:#D98E22; --break:#DDE2EB;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){color-scheme:dark;
  --bg:#0F1522; --paper:#182133; --soft:#1E2A40; --ink:#E7EBF3; --muted:#9AA6BD; --line:#2E3A52; --grid:#243049; --break:#2A3448;}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0F1522;--paper:#182133;--soft:#1E2A40;--ink:#E7EBF3;--muted:#9AA6BD;--line:#2E3A52;--grid:#243049;--break:#2A3448;}
*{box-sizing:border-box;margin:0;padding:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}

/* ===== walkthrough shell ===== */
.shell{display:grid;grid-template-columns:270px 1fr;height:100%}
.story{border-right:1px solid var(--line);padding:22px 16px;overflow-y:auto;background:var(--paper)}
.story h1{font-family:var(--display);font-weight:800;font-size:21px;line-height:1.15;margin-bottom:4px}
.story .by{color:var(--muted);font-size:13px;margin-bottom:18px}
.story h4{font-size:12px;color:var(--muted);margin:16px 6px 6px;font-weight:700}
.story ol{list-style:none;counter-reset:n}
.story li button{width:100%;text-align:left;border:0;background:none;padding:7px 8px;border-radius:8px;display:flex;gap:10px;align-items:center;font-size:14px}
.story li button b{min-width:24px;height:24px;border-radius:6px;background:var(--soft);display:grid;place-items:center;font-size:12px;color:var(--muted)}
.story li button.on{background:color-mix(in srgb,var(--brand) 12%,transparent)}
.story li button.on b{background:var(--brand);color:#fff}
.story li button.seen b{color:var(--brand)}
.main{display:flex;flex-direction:column;min-width:0;height:100%;overflow:hidden}
.top{display:flex;gap:20px;align-items:flex-start;padding:18px 26px 14px;border-bottom:1px solid var(--line);background:var(--paper)}
.top .t{flex:1;min-width:0}
.top .step{font-size:13px;color:var(--muted)}
.top h2{font-family:var(--display);font-weight:800;font-size:26px;line-height:1.15;margin:2px 0 6px}
.top p{color:var(--muted);max-width:78ch}
.top ul{margin-top:8px;display:flex;flex-wrap:wrap;gap:6px 18px;list-style:none;font-size:14px}
.top ul li::before{content:"";display:inline-block;width:7px;height:7px;border-radius:2px;background:var(--brand);margin-right:7px;vertical-align:middle}
.navs{display:flex;gap:8px;flex-shrink:0}
.navs button{border:1px solid var(--line);background:var(--paper);border-radius:9px;padding:8px 14px}
.navs button.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.canvas{flex:1;overflow:auto;padding:22px 26px}
.mobile-pick{display:none}

/* ===== app window ===== */
.win{background:var(--paper);border:1px solid var(--line);border-radius:14px;overflow:hidden;min-width:900px;box-shadow:0 1px 0 var(--line)}
.win .bar{display:flex;align-items:center;gap:8px;padding:9px 14px;border-bottom:1px solid var(--line);background:var(--soft);font-size:13px;color:var(--muted)}
.win .bar i{width:11px;height:11px;border-radius:50%;background:var(--line)}
.win .bar span{margin-left:10px;background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:2px 12px;flex:1;max-width:460px}
.app{display:grid;grid-template-columns:210px 1fr;min-height:560px}
.side{background:var(--soft);border-right:1px solid var(--line);padding:14px 10px}
.logo{display:flex;align-items:center;gap:9px;font-family:var(--display);font-weight:800;font-size:16px;padding:4px 6px 14px}
.logo i{width:26px;height:26px;border-radius:7px;background:conic-gradient(var(--s1) 0 25%,var(--s2) 0 50%,var(--s3) 0 75%,var(--s4) 0)}
.side .grp{font-size:11.5px;color:var(--muted);margin:12px 8px 4px;font-weight:700}
.side a{display:block;padding:6px 9px;border-radius:7px;font-size:13.5px;color:var(--ink);text-decoration:none}
.side a.on{background:var(--paper);font-weight:700;box-shadow:inset 3px 0 0 var(--brand)}
.body{padding:20px 24px;min-width:0}
.head{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.head h3{font-family:var(--display);font-weight:800;font-size:22px;flex:1}
.btn{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:7px 13px;font-size:13.5px}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.good{background:var(--good);border-color:var(--good);color:#fff}
.search{border:1px solid var(--line);border-radius:8px;padding:7px 12px;background:var(--paper);min-width:200px;color:var(--muted)}
.filters{display:flex;gap:8px;margin-bottom:12px;align-items:center;flex-wrap:wrap}
.pill{border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:13px;background:var(--paper)}
.pill.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
table.t th{text-align:left;font-weight:700;color:var(--muted);font-size:12.5px;padding:8px 10px;border-bottom:1px solid var(--line)}
table.t td{padding:9px 10px;border-bottom:1px solid var(--grid);vertical-align:middle}
table.t tr.off td{color:var(--muted)}
table.t tr.off td:not(:last-child){opacity:.55}
.tog{width:36px;height:20px;border-radius:999px;border:0;background:var(--line);position:relative;vertical-align:middle}
.tog::after{content:"";position:absolute;left:3px;top:3px;width:14px;height:14px;border-radius:50%;background:#fff;transition:left .15s}
.tog.on{background:var(--good)}
.tog.on::after{left:19px}
.chip{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:700;background:var(--soft);border:1px solid var(--line)}
.dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:7px;vertical-align:middle}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.card{border:1px solid var(--line);border-radius:12px;padding:14px 16px;background:var(--paper)}
.card .n{font-family:var(--display);font-weight:800;font-size:28px}
.card .l{color:var(--muted);font-size:13px}
.two{display:grid;grid-template-columns:1.3fr 1fr;gap:14px}
.panel{border:1px solid var(--line);border-radius:12px;padding:14px 16px;background:var(--paper)}
.panel h5{font-size:14px;margin-bottom:10px}
.ck{display:flex;align-items:center;gap:10px;padding:6px 0;font-size:13.5px}
.ck i{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;color:#fff;font-style:normal;font-size:11px;flex-shrink:0}
.ck i.y{background:var(--good)}.ck i.n{background:var(--line);color:var(--muted)}.ck i.w{background:var(--warn)}
.field{display:grid;gap:4px;margin-bottom:12px;font-size:13px}
.field label{color:var(--muted);font-weight:700;font-size:12.5px}
.field .in{border:1px solid var(--line);border-radius:8px;padding:8px 11px;background:var(--paper)}
.wiz{display:flex;gap:6px;margin-bottom:16px}
.wiz div{flex:1;height:6px;border-radius:3px;background:var(--line)}
.wiz div.d{background:var(--brand)}

/* timetable grid */
.tt{display:grid;grid-template-columns:86px repeat(6,1fr);gap:3px;font-size:12px}
.tt .h{font-weight:700;color:var(--muted);text-align:center;padding:4px 0}
.tt .tm{color:var(--muted);font-size:11.5px;display:flex;flex-direction:column;justify-content:center;padding-left:4px}
.tt .tm b{color:var(--ink);font-size:12px}
.tt .c{border-radius:7px;min-height:50px;padding:5px 7px;color:#fff;line-height:1.25;position:relative}
.tt .c b{display:block;font-size:12.5px}
.tt .c.e{background:var(--grid);color:var(--muted)}
.tt .brk{grid-column:2/-1;border-radius:7px;text-align:center;padding:4px;color:var(--muted);font-weight:700;font-size:12px;
  background:repeating-linear-gradient(135deg,var(--break) 0 7px,transparent 7px 14px);border:1px dashed var(--line)}
.tt .c[draggable=true]{cursor:grab}
.tt .c.ok{outline:2px solid var(--good);outline-offset:-2px}
.tt .c.no{outline:2px solid var(--bad);outline-offset:-2px}
.tt .c .lk{position:absolute;right:5px;top:4px;font-size:11px}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12.5px;color:var(--muted);margin-top:10px}

/* matrix */
.mx td,.mx th{text-align:center}
.mx td:first-child,.mx th:first-child{text-align:left}
.box{width:20px;height:20px;border-radius:5px;border:1.5px solid var(--line);background:none;display:inline-grid;place-items:center;color:#fff;font-size:12px}
.box.on{background:var(--brand);border-color:var(--brand)}
.load{height:8px;border-radius:4px;background:var(--grid);overflow:hidden;width:120px;display:inline-block;vertical-align:middle}
.load i{display:block;height:100%}

/* day strip */
.daystrip{display:flex;gap:3px;height:64px;margin:6px 0}
.daystrip div{border-radius:7px;display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff;text-align:center}
.daystrip .p{background:var(--s1)}
.daystrip .b{background:repeating-linear-gradient(135deg,var(--break) 0 7px,transparent 7px 14px);border:1px dashed var(--line);color:var(--muted);cursor:grab}

/* generation */
.prog{height:10px;border-radius:5px;background:var(--grid);overflow:hidden;margin:8px 0}
.prog i{display:block;height:100%;background:var(--brand);width:0}

/* pdf */
.pdfwrap{background:var(--soft);padding:18px;border-radius:10px;display:flex;justify-content:center}
.pdf{background:#fff;color:#1B2540;width:100%;max-width:980px;padding:22px 26px;border-radius:4px;box-shadow:0 2px 10px rgba(20,30,60,.12);font-size:11.5px}
.pdf .ph{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid #1B2540;padding-bottom:8px;margin-bottom:10px}
.pdf .ph b{font-family:var(--display);font-size:18px;display:block}
.pdf table{width:100%;border-collapse:collapse;table-layout:fixed}
.pdf th,.pdf td{border:1px solid #C5CDDA;padding:4px 5px;text-align:center;vertical-align:middle;height:36px}
.pdf th{background:#EEF1F6;font-size:11px}
.pdf td.brk{background:repeating-linear-gradient(135deg,#E3E7EE 0 6px,#fff 6px 12px);font-weight:700;color:#5B6782;height:20px}
.pdf .pf{display:flex;justify-content:space-between;color:#5B6782;font-size:10.5px;margin-top:8px}
.pdf td span{display:block;font-size:10px;color:#5B6782}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px}
.tabs button{border:0;background:none;padding:8px 14px;border-bottom:2px solid transparent;font-size:13.5px;color:var(--muted)}
.tabs button.on{border-color:var(--brand);color:var(--ink);font-weight:700}

/* phone */
.phone{width:330px;border:10px solid var(--ink);border-radius:36px;overflow:hidden;background:var(--paper);margin:0 auto}
.phone .ps{padding:16px}
.phone .lec{border-radius:12px;padding:12px 14px;color:#fff;margin-bottom:8px}
.phone .lec small{display:block;opacity:.9}
.phone .now{outline:3px solid var(--warn);outline-offset:2px}
.daysel{display:flex;gap:5px;margin:10px 0 14px}
.daysel span{flex:1;text-align:center;padding:6px 0;border-radius:8px;background:var(--soft);font-size:12px;font-weight:700}
.daysel span.on{background:var(--brand);color:#fff}

.login{display:grid;grid-template-columns:1fr 1fr;min-height:560px}
.login .art{background:var(--soft);display:grid;place-items:center;padding:30px}
.login .form{padding:60px 56px;display:flex;flex-direction:column;justify-content:center}

@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  .story{display:none}
  .mobile-pick{display:block;margin-top:8px}
  .top{flex-direction:column}
  .canvas{padding:14px}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="shell">
  <aside class="story" aria-label="Screens">
    <h1>Auto Time Table Generator</h1>
    <p class="by">Screen walkthrough for client review</p>
    <div id="storyList"></div>
  </aside>
  <main class="main">
    <header class="top">
      <div class="t">
        <div class="step" id="stepNo"></div>
        <h2 id="stepTitle"></h2>
        <p id="stepPurpose"></p>
        <ul id="stepPoints"></ul>
        <select class="mobile-pick search" id="mobilePick" aria-label="Jump to screen"></select>
      </div>
      <div class="navs">
        <button id="prevBtn">Back</button>
        <button id="nextBtn" class="pri">Next screen</button>
      </div>
    </header>
    <div class="canvas" id="canvas"></div>
  </main>
</div>

<script>
/* ---------- sample data ---------- */
const S = {
  DS:{t:"Data Structures",c:"s1",f:"RM",cr:4,th:3,pr:2},
  DBMS:{t:"Database Mgmt Systems",c:"s2",f:"KS",cr:4,th:3,pr:2},
  OS:{t:"Operating Systems",c:"s3",f:"AP",cr:3,th:3,pr:0},
  JAVA:{t:"Java Programming",c:"s4",f:"NJ",cr:4,th:3,pr:2},
  MATH:{t:"Discrete Mathematics",c:"s5",f:"PD",cr:3,th:3,pr:0},
  ENG:{t:"Communication Skills",c:"s6",f:"HV",cr:2,th:2,pr:0}
};
const F = {
  RM:{n:"Dr. Rina Mehta",d:"Computer Science",max:5,wk:18},
  KS:{n:"Prof. Kunal Shah",d:"Computer Science",max:5,wk:18},
  AP:{n:"Prof. Amit Patel",d:"Computer Science",max:5,wk:16},
  NJ:{n:"Prof. Nisha Joshi",d:"Computer Science",max:5,wk:18},
  PD:{n:"Dr. Pooja Desai",d:"Mathematics",max:4,wk:14},
  HV:{n:"Ms. Heena Vora",d:"English",max:4,wk:12}
};
const DAYS=["Mon","Tue","Wed","Thu","Fri","Sat"];
const DAYS_FULL=["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const SLOTS=[["P1","09:00","09:55"],["P2","09:55","10:50"],["P3","11:05","12:00"],["P4","12:00","12:55"],["P5","13:35","14:30"],["P6","14:30","15:25"]];
/* week[period][day]; "L:X" = 2-slot practical starting here, "^" = continuation, "" = free */
const WEEK_A=[
 ["DS","OS","L:JAVA","MATH","DBMS","JAVA"],
 ["DBMS","DS","^","JAVA","OS","DBMS"],
 ["OS","MATH","DS","L:DBMS","JAVA","MATH"],
 ["JAVA","DBMS","OS","^","ENG","ENG"],
 ["L:DS","JAVA","MATH","DS","ENG",""],
 ["^","ENG","DBMS","OS","",""]
];
function shiftWeek(w,n){return w.map(r=>r.map((_,d)=>r[(d+n)%5===d?d:(d+n)%6]))}
const WEEK_B=WEEK_A.map(r=>[r[2],r[3],r[0],r[1],r[4],r[5]]).map((r,i,a)=>r);
const ROOM={A:"Room 201",B:"Room 202"};
const LABS=["Lab 1","Lab 2"];
const cellHTML=(code,div,small)=>{
  if(!code) return `<div class="c e">${small?"":"Free"}</div>`;
  if(code==="^") return null;
  const lab=code.startsWith("L:"); const k=lab?code.slice(2):code; const s=S[k];
  const where=lab?"Lab 1 · B1 / Lab 2 · B2":ROOM[div||"A"];
  return `<div class="c" style="background:var(--${s.c})${lab?";grid-row:span 2":""}"><b>${k}${lab?" Lab":""}</b>${s.f} · ${where}</div>`;
};
function gridHTML(week,div,opts={}){
  let h=`<div class="tt"><div></div>${DAYS.map(d=>`<div class="h">${d}</div>`).join("")}`;
  SLOTS.forEach((sl,p)=>{
    if(p===2) h+=`<div class="tm">10:50</div><div class="brk">Tea break · 15 min</div>`;
    if(p===4) h+=`<div class="tm">12:55</div><div class="brk">Lunch break · 40 min</div>`;
    h+=`<div class="tm"><b>${sl[0]}</b>${sl[1]}–${sl[2]}</div>`;
    DAYS.forEach((_,d)=>{
      const code=week[p][d];
      if(code==="^") return;
      if(d===5&&p>3){h+=`<div class="c e" style="background:repeating-linear-gradient(135deg,var(--break) 0 7px,transparent 7px 14px)">Half day</div>`;return;}
      let c=cellHTML(code,div);
      if(opts.edit) c=c.replace('class="c','data-p="'+p+'" data-d="'+d+'" draggable="'+(code&&!code.startsWith("L:")?"true":"false")+'" class="c');
      if(opts.lock && p===0 && d===0) c=c.replace("</div>",'<span class="lk" title="Locked">🔒</span></div>');
      h+=c;
    });
  });
  return h+`</div>`;
}
const legend=()=>`<div class="legend">${Object.entries(S).map(([k,s])=>`<span><i class="dot" style="background:var(--${s.c})"></i>${k} – ${s.t} (${s.f})</span>`).join("")}</div>`;

/* ---------- app frame ---------- */
const MENU=[
 ["Home",["Dashboard"]],
 ["Setup",["Academic Year","Shift & Breaks","Programs & Semesters","Classes & Batches","Rooms & Labs","Faculty","Subjects","Faculty ↔ Subject"]],
 ["Timetable",["Generate","Editor","Publish"]],
 ["Reports",["Semester-wise","Faculty-wise","Day-wise","Room & Lab","Master"]]
];
function frame(active,url,inner){
  return `<div class="win"><div class="bar"><i></i><i></i><i></i><span>timetable.yourcollege.edu/${url}</span></div>
  <div class="app"><nav class="side"><div class="logo"><i></i>AutoTimeTable</div>
  ${MENU.map(([g,items])=>`<div class="grp">${g}</div>${items.map(x=>`<a href="#" class="${x===active?"on":""}" onclick="return false">${x}</a>`).join("")}`).join("")}
  </nav><div class="body">${inner}</div></div></div>`;
}
const tog=(on)=>`<button class="tog ${on?"on":""}" aria-label="Active" onclick="toggleRow(this)"></button>`;
function toggleRow(b){b.classList.toggle("on");const tr=b.closest("tr");if(tr)tr.classList.toggle("off",!b.classList.contains("on"));}
function listPage(title,cols,rows,extra=""){
  return `<div class="head"><h3>${title}</h3><input class="search" placeholder="Search ${title.toLowerCase()}"><button class="btn pri">+ Add</button><button class="btn">Import Excel</button></div>
  <div class="filters"><span class="pill on">All</span><span class="pill">Active</span><span class="pill">Inactive</span>${extra}</div>
  <table class="t"><thead><tr>${cols.map(c=>`<th>${c}</th>`).join("")}<th>Active</th></tr></thead><tbody>
  ${rows.map(r=>`<tr class="${r.off?"off":""}">${r.v.map(x=>`<td>${x}</td>`).join("")}<td>${tog(!r.off)}</td></tr>`).join("")}</tbody></table>`;
}

/* ---------- PDF report builders ---------- */
function pdfShell(title,sub,table,foot){
  return `<div class="pdfwrap"><div class="pdf"><div class="ph"><div><b>Shree Vidya College of Computer Applications</b>${title}</div><div style="text-align:right">${sub}</div></div>${table}<div class="pf"><span>Academic Year 2026-27 · Version 3 (published)</span><span>${foot||"Generated on 25 Nov 2026"}</span></div></div></div>`;
}
function pdfWeek(week,div){
  let h=`<table><thead><tr><th style="width:80px">Time</th>${DAYS_FULL.map(d=>`<th>${d}</th>`).join("")}</tr></thead><tbody>`;
  SLOTS.forEach((sl,p)=>{
    if(p===2) h+=`<tr><td>10:50–11:05</td><td class="brk" colspan="6">TEA BREAK</td></tr>`;
    if(p===4) h+=`<tr><td>12:55–13:35</td><td class="brk" colspan="6">LUNCH BREAK</td></tr>`;
    h+=`<tr><td>${sl[1]}–${sl[2]}</td>`;
    DAYS.forEach((_,d)=>{
      const c=week[p][d]; if(c==="^") return;
      if(d===5&&p===4){h+=`<td class="brk" rowspan="2">HALF DAY</td>`;return;}
      if(d===5&&p===5) return;
      if(!c){h+=`<td></td>`;return;}
      const lab=c.startsWith("L:"),k=lab?c.slice(2):c,s=S[k];
      h+=`<td ${lab?'rowspan="2"':""} style="background:color-mix(in srgb,var(--${s.c}) 16%,#fff)"><b>${k}${lab?" Lab":""}</b><span>${s.f} · ${lab?"Lab 1 (B1) / Lab 2 (B2)":ROOM[div]}</span></td>`;
    });
    h+=`</tr>`;
  });
  return h+`</tbody></table>`;
}
function facultyWeek(code){
  /* collect from division A and B */
  const g=SLOTS.map(()=>DAYS.map(()=>""));
  [["A",WEEK_A],["B",WEEK_B]].forEach(([div,w])=>w.forEach((r,p)=>r.forEach((c,d)=>{
    if(!c||c==="^")return; const lab=c.startsWith("L:"),k=lab?c.slice(2):c;
    if(S[k].f===code && !g[p][d]) {g[p][d]=`<b>${k}${lab?" Lab":""}</b><span>BCA-3${div} · ${lab?"Lab 1":ROOM[div]}</span>`; if(lab&&p<5) g[p+1][d]=`<b>${k} Lab</b><span>BCA-3${div} · Lab 2</span>`;}
  })));
  let n=0;
  let h=`<table><thead><tr><th style="width:80px">Time</th>${DAYS_FULL.map(d=>`<th>${d}</th>`).join("")}</tr></thead><tbody>`;
  SLOTS.forEach((sl,p)=>{
    if(p===2) h+=`<tr><td>10:50–11:05</td><td class="brk" colspan="6">TEA BREAK</td></tr>`;
    if(p===4) h+=`<tr><td>12:55–13:35</td><td class="brk" colspan="6">LUNCH BREAK</td></tr>`;
    h+=`<tr><td>${sl[1]}–${sl[2]}</td>${g[p].map(x=>{if(x)n++;return `<td style="${x?"background:#EEF3FC":""}">${x}</td>`}).join("")}</tr>`;
  });
  return {html:h+`</tbody></table>`,n};
}
function dayWise(d){
  const divs=[["BCA-3A",WEEK_A,"A"],["BCA-3B",WEEK_B,"B"]];
  let h=`<table><thead><tr><th style="width:90px">Class</th>${SLOTS.map((s,i)=>`<th>${s[0]}<br><span style="font-weight:400">${s[1]}</span></th>${i===1?'<th style="width:34px">Tea</th>':i===3?'<th style="width:40px">Lunch</th>':""}`).join("")}</tr></thead><tbody>`;
  divs.forEach(([name,w,div])=>{
    h+=`<tr><td><b>${name}</b></td>`;
    SLOTS.forEach((_,p)=>{
      let c=w[p][d]; let lab=false;
      if(c==="^"){c=w[p-1][d];}
      if(c&&c.startsWith("L:")){lab=true;c=c.slice(2);}
      h+= c?`<td style="background:color-mix(in srgb,var(--${S[c].c}) 16%,#fff)"><b>${c}${lab?" Lab":""}</b><span>${S[c].f}</span></td>`:`<td></td>`;
      if(p===1||p===3) h+=`<td class="brk"></td>`;
    });
    h+=`</tr>`;
  });
  return h+`</tbody></table>`;
}

/* ---------- interactions ---------- */
let genTimer=null;
function runGen(){
  clearInterval(genTimer);
  const N=120,fit=[],cl=[];let i=0;
  const bar=document.getElementById("gBar"),gG=document.getElementById("gGen"),gC=document.getElementById("gClash"),gF=document.getElementById("gFit");
  const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  function step(){
    i++; const t=i/N;
    const c=Math.max(0,Math.round(212*Math.pow(1-Math.min(1,t*1.35),2.4)));
    const f=0.04+0.93*(1-Math.pow(1-t,3));
    fit.push(f);cl.push(c);
    gG.textContent=i*25; gC.textContent=c; gC.style.color=c?"var(--bad)":"var(--good)"; gF.textContent=f.toFixed(2); bar.style.width=(t*100)+"%";
    const path=(arr,fn)=>arr.map((v,k)=>(k?"L":"M")+(k/(N-1)*800).toFixed(1)+" "+fn(v).toFixed(1)).join(" ");
    document.getElementById("gFitLine").setAttribute("d",path(fit,v=>180-v*160));
    document.getElementById("gClashLine").setAttribute("d",path(cl,v=>180-v/212*160));
    if(i>=N){clearInterval(genTimer);document.getElementById("gDone").style.display="flex";}
  }
  if(reduce){for(let k=0;k<N;k++)step();return;}
  genTimer=setInterval(step,30);
}
function wireEditor(){
  const cells=[...document.querySelectorAll(".tt .c[data-p]")];
  const msg=document.getElementById("dragMsg");
  let src=null;
  cells.forEach(c=>{
    c.addEventListener("dragstart",e=>{src=c;e.dataTransfer.setData("text/plain","x");
      const k=c.querySelector("b")?.textContent;const fac=k&&S[k]?S[k].f:null;
      cells.forEach(o=>{if(o===src||o.style.gridRow)return;
        const ok=!(Number(o.dataset.d)===5&&Number(o.dataset.p)>3) && !(fac==="PD"&&Number(o.dataset.d)===2&&Number(o.dataset.p)>3);
        o.classList.add(ok?"ok":"no");o.dataset.reason=ok?"":(Number(o.dataset.d)===5?"Saturday is a half day":"Dr. Desai is not available");});
    });
    c.addEventListener("dragend",()=>cells.forEach(o=>o.classList.remove("ok","no")));
    c.addEventListener("dragover",e=>{if(c.classList.contains("ok"))e.preventDefault();});
    c.addEventListener("dragenter",()=>{if(c.classList.contains("no"))msg.innerHTML='<span style="color:var(--bad)"><b>Clash:</b> '+c.dataset.reason+'</span>';else if(c.classList.contains("ok"))msg.innerHTML='<span style="color:var(--good)">Allowed here</span>';});
    c.addEventListener("drop",e=>{e.preventDefault();if(!src||src===c)return;
      const a=src.innerHTML,ab=src.style.background,ac=src.className;src.innerHTML=c.innerHTML;src.style.background=c.style.background;src.className=c.className;
      c.innerHTML=a;c.style.background=ab;c.className=ac;
      [src,c].forEach(x=>{x.classList.remove("ok","no");x.draggable=!x.classList.contains("e");});
      msg.innerHTML='<span style="color:var(--good)"><b>Moved.</b> No hard clashes.</span>';});
  });
}

/* ---------- navigation ---------- */
let cur=0; const seen=new Set();
const list=document.getElementById("storyList"), pick=document.getElementById("mobilePick");
let lastG="",html="";
SCREENS.forEach((s,i)=>{
  if(s.g!==lastG){if(lastG)html+="</ol>";html+=`<h4>${s.g}</h4><ol>`;lastG=s.g;}
  html+=`<li><button data-i="${i}"><b>${i+1}</b>${s.t}</button></li>`;
  pick.insertAdjacentHTML("beforeend",`<option value="${i}">${i+1}. ${s.t}</option>`);
});
list.innerHTML=html+"</ol>";
list.addEventListener("click",e=>{const b=e.target.closest("button");if(b)go(+b.dataset.i);});
pick.addEventListener("change",()=>go(+pick.value));
function go(i){
  cur=Math.max(0,Math.min(SCREENS.length-1,i)); seen.add(cur);
  const s=SCREENS[cur];
  clearInterval(genTimer);
  document.getElementById("stepNo").textContent=`Screen ${cur+1} of ${SCREENS.length} · ${s.g}`;
  document.getElementById("stepTitle").textContent=s.t;
  document.getElementById("stepPurpose").textContent=s.p;
  document.getElementById("stepPoints").innerHTML=s.pts.map(x=>`<li>${x}</li>`).join("");
  document.getElementById("canvas").innerHTML=s.r();
  document.getElementById("canvas").scrollTop=0;
  if(s.after) s.after();
  list.querySelectorAll("button").forEach(b=>{const k=+b.dataset.i;b.classList.toggle("on",k===cur);b.classList.toggle("seen",seen.has(k)&&k!==cur);});
  pick.value=cur;
  document.getElementById("prevBtn").disabled=cur===0;
  document.getElementById("nextBtn").textContent=cur===SCREENS.length-1?"Back to start":"Next screen";
  if(location.hash!=="#screen-"+(cur+1)) history.replaceState(null,"","#screen-"+(cur+1));
}
document.getElementById("prevBtn").onclick=()=>go(cur-1);
document.getElementById("nextBtn").onclick=()=>go(cur===SCREENS.length-1?0:cur+1);
document.addEventListener("keydown",e=>{if(e.target.closest("input,select"))return;if(e.key==="ArrowRight")go(cur+1);if(e.key==="ArrowLeft")go(cur-1);});
const m=location.hash.match(/^#screen-(\d+)$/); go(m?+m[1]-1:0);
</script>
